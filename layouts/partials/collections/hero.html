<header class="exec-hero collection-hero">
  <div>
    <p class="exec-eyebrow">{{ i18n (printf "%s_eyebrow" .Section) }}</p>
    <h1>{{ .Title }}</h1>
    <div class="exec-intro">{{ .Content }}</div>
  </div>
  {{ if eq .Section "projects" }}
    {{ partial "home/system-art.html" . }}
  {{ else }}
    <div class="collection-editorial-art" aria-hidden="true">
      <svg viewBox="0 0 360 260" fill="none" focusable="false">
        <rect x="72" y="27" width="220" height="184" rx="12" stroke="currentColor" opacity=".2"/>
        <rect x="52" y="47" width="220" height="184" rx="12" fill="var(--exec-panel)" stroke="currentColor" opacity=".5"/>
        <path d="M80 84h44m-44 30h160m-160 20h160m-160 20h120m-120 38h60" stroke="currentColor" stroke-width="2"/>
        <path d="m214 185 8 8-8 8m-16-8h24" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
  {{ end }}
</header>
